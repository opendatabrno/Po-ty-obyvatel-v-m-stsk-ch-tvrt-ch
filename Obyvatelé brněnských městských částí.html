<!doctype html><html lang="cs"><head><meta charset="utf-8"><meta name="viewport" content="width=device-width,initial-scale=1,viewport-fit=cover"><title>Obyvatelé brněnských městských částí</title>
<style>:root{--bg:#fafaf7;--fg:#1c1c1a;--mu:#6b6b66;--bar:#2f6f9f;--sel:#d9822b;--card:#fff;--bd:#e2e2dc;box-sizing:border-box;padding-top:env(safe-area-inset-top,0px);padding-bottom:env(safe-area-inset-bottom,0px)}
@media(prefers-color-scheme:dark){:root:not([data-theme=light]){--bg:#17181a;--fg:#ececea;--mu:#9a9a94;--bar:#5a9fd0;--sel:#e8963f;--card:#202225;--bd:#33353a}}
html,body{margin:0;background:var(--bg);color:var(--fg);font:15px/1.4 system-ui,sans-serif}
main{max-width:980px;margin:auto;padding:20px 16px}h1{font-size:22px;margin:0 0 4px}.s{color:var(--mu);margin:0 0 16px}
.g{display:grid;grid-template-columns:1.3fr 1fr;gap:16px}@media(max-width:760px){.g{grid-template-columns:1fr}}
.c{background:var(--card);border:1px solid var(--bd);border-radius:12px;padding:14px}
.t{display:flex;gap:6px;margin-bottom:10px}button{font:inherit;border:1px solid var(--bd);background:var(--card);color:var(--fg);border-radius:8px;padding:4px 10px;cursor:pointer}button.on{background:var(--bar);color:#fff;border-color:var(--bar)}
.r{display:grid;grid-template-columns:130px 1fr 58px;align-items:center;gap:8px;padding:2px 4px;border-radius:6px;cursor:pointer;font-size:13px}.r:hover{background:var(--bd)}.r.sel{background:var(--bd)}
.bw{height:14px}.b{height:100%;background:var(--bar);border-radius:3px;transition:width .4s}.sel .b{background:var(--sel)}.v{text-align:right;font-variant-numeric:tabular-nums;color:var(--mu)}
h2{font-size:17px;margin:0 0 2px}.k{display:grid;grid-template-columns:110px 1fr 50px;gap:6px;align-items:center;font-size:13px;margin:3px 0}.k .b{background:var(--sel)}
.st{display:flex;height:16px;border-radius:4px;overflow:hidden;margin:8px 0 4px}.lg{display:flex;justify-content:space-between;font-size:12px;color:var(--mu)}
</style></head><body><main><h1>Obyvatelé brněnských městských částí</h1><p class="s">Stav k 4. 1. 2026 · celkem <b id="tot"></b> obyvatel · klikněte na část pro detail</p>
<div class="g"><div class="c"><div class="t"><button id="bv" class="on">Podle počtu</button><button id="ba">Abecedně</button></div><div id="l"></div></div>
<div class="c" id="d"></div></div></main><script>
const D=[{"n": "Bohunice", "v": 13423, "k": [], "a": [1886, 7986, 3551]}, {"n": "Bosonohy", "v": 2784, "k": [], "a": [459, 1784, 541]}, {"n": "Bystrc", "v": 24272, "k": [], "a": [3740, 14638, 5894]}, {"n": "Černovice", "v": 8548, "k": [], "a": [1279, 5778, 1491]}, {"n": "Chrlice", "v": 3792, "k": [], "a": [594, 2457, 741]}, {"n": "Ivanovice", "v": 2063, "k": [], "a": [356, 1331, 376]}, {"n": "Jehnice", "v": 1190, "k": [], "a": [178, 769, 243]}, {"n": "Jih", "v": 10738, "k": [["Komárov", 5768], ["Horní Heršpice", 2320], ["Přízřenice", 1543], ["Dolní Heršpice", 871], ["Trnitá", 236]], "a": [1447, 7537, 1754]}, {"n": "Jundrov", "v": 4978, "k": [["Jundrov", 4811], ["Pisárky", 167]], "a": [839, 3144, 995]}, {"n": "Kníničky", "v": 1180, "k": [], "a": [169, 752, 259]}, {"n": "Kohoutovice", "v": 12201, "k": [["Kohoutovice", 11645], ["Pisárky", 547], ["Jundrov", 9]], "a": [1676, 7121, 3404]}, {"n": "Komín", "v": 8163, "k": [], "a": [1276, 4884, 2003]}, {"n": "Královo Pole", "v": 30669, "k": [["Královo Pole", 21621], ["Ponava", 7093], ["Sadová", 1674], ["Černá Pole", 281]], "a": [4378, 20535, 5756]}, {"n": "Líšeň", "v": 26860, "k": [], "a": [4274, 16513, 6073]}, {"n": "Maloměřice a Obřany", "v": 6382, "k": [["Maloměřice", 3509], ["Obřany", 2873]], "a": [1069, 4134, 1179]}, {"n": "Medlánky", "v": 6019, "k": [], "a": [1017, 4001, 1001]}, {"n": "Nový Lískovec", "v": 10438, "k": [], "a": [1427, 6985, 2026]}, {"n": "Ořešín", "v": 625, "k": [], "a": [102, 384, 139]}, {"n": "Řečkovice a Mokrá Hora", "v": 14930, "k": [["Řečkovice", 14040], ["Mokrá Hora", 890]], "a": [2033, 9102, 3795]}, {"n": "Sever", "v": 49971, "k": [["Černá Pole", 17655], ["Lesná", 15603], ["Husovice", 7842], ["Zábrdovice", 6384], ["Soběšice", 2487]], "a": [7077, 32961, 9933]}, {"n": "Slatina", "v": 11194, "k": [], "a": [1789, 7298, 2107]}, {"n": "Starý Lískovec", "v": 12725, "k": [], "a": [1768, 7555, 3402]}, {"n": "Střed", "v": 70169, "k": [["Veveří", 20346], ["Staré Brno", 13084], ["Štýřice", 9241], ["Zábrdovice", 7892], ["Brno-město", 5623], ["Trnitá", 5064], ["Stránice", 4690], ["Černá Pole", 2257], ["Pisárky", 1972]], "a": [10227, 48701, 11241]}, {"n": "Tuřany", "v": 6025, "k": [["Tuřany", 2891], ["Brněnské Ivanovice", 1604], ["Holásky", 1186], ["Dvorska", 344]], "a": [898, 3947, 1180]}, {"n": "Útěchov", "v": 862, "k": [], "a": [134, 550, 178]}, {"n": "Vinohrady", "v": 12036, "k": [["Židenice", 12033], ["Maloměřice", 3]], "a": [1724, 7286, 3026]}, {"n": "Žabovřesky", "v": 21918, "k": [], "a": [3206, 13563, 5149]}, {"n": "Žebětín", "v": 6194, "k": [], "a": [1288, 3973, 933]}, {"n": "Židenice", "v": 23819, "k": [["Židenice", 22170], ["Zábrdovice", 1649]], "a": [3594, 15810, 4415]}],f=n=>n.toLocaleString("cs-CZ"),T=D.reduce((s,d)=>s+d.v,0);
document.getElementById("tot").textContent=f(T);let sort="v",sel=D.find(d=>d.n=="Střed");
const L=document.getElementById("l");
function draw(){const m=Math.max(...D.map(d=>d.v)),arr=[...D].sort((a,b)=>sort=="v"?b.v-a.v:a.n.localeCompare(b.n,"cs"));
L.innerHTML=arr.map(d=>`<div class="r${d==sel?" sel":""}" data-n="${d.n}"><span>${d.n}</span><div class="bw"><div class="b" style="width:${d.v/m*100}%"></div></div><span class="v">${f(d.v)}</span></div>`).join("");
L.querySelectorAll(".r").forEach(e=>e.onclick=()=>{sel=D.find(d=>d.n==e.dataset.n);draw()});detail()}
function detail(){const d=sel,p=d.a.map(x=>x/d.v*100),m=d.k.length?d.k[0][1]:1;
document.getElementById("d").innerHTML=`<h2>Brno-${["Jih","Sever","Střed"].includes(d.n)?d.n.toLowerCase():d.n}</h2><div class="s" style="margin:0">${f(d.v)} obyvatel · ${(d.v/T*100).toFixed(1).replace(".",",")} % Brna</div>
<div style="margin-top:12px;font-size:13px;color:var(--mu)">Věková struktura</div><div class="st"><div style="width:${p[0]}%;background:#6fb58a"></div><div style="width:${p[1]}%;background:var(--bar)"></div><div style="width:${p[2]}%;background:var(--sel)"></div></div>
<div class="lg"><span>0–14: ${f(d.a[0])} (${p[0].toFixed(0)} %)</span><span>15–64: ${p[1].toFixed(0)} %</span><span>65+: ${f(d.a[2])} (${p[2].toFixed(0)} %)</span></div>
<div style="margin:14px 0 4px;font-size:13px;color:var(--mu)">Katastrální území</div>`+(d.k.length?d.k.map(k=>`<div class="k"><span>${k[0]}</span><div class="bw"><div class="b" style="width:${k[1]/m*100}%"></div></div><span class="v">${f(k[1])}</span></div>`).join(""):`<div class="s">Část tvoří jedno katastrální území.</div>`)}
bv.onclick=()=>{sort="v";bv.className="on";ba.className="";draw()};ba.onclick=()=>{sort="a";ba.className="on";bv.className="";draw()};draw();
</script></body></html>
