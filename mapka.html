$("l").innerHTML=[...A].sort((a,b)=>val(b)-val(a)).map(d=>`<div class="r ${d==sel?"sel":""}" data-i="${A.indexOf(d)}"><span>${d.n}</span><div class="bw"><div class="b" style="width:${val(d)/m*100}%"></div></div><span class="v">${f(val(d))}</span></div>`).join("");
$("l").querySelectorAll(".r").forEach(r=>r.onclick=()=>{sel=A[r.dataset.i];draw()});
let h=`<h2>${lvl?sel.n:"Brno-"+(["Jih","Sever","Střed"].includes(sel.n)?sel.n.toLowerCase():sel.n)}</h2><div class="s" style="margin:0">${f(sel.v)} obyvatel · ${f(sel.v/sel.s)} os./km² · ${sel.s.toFixed(1).replace(".",",")} km²${lvl?"":" · "+(sel.v/T*100).toFixed(1).replace(".",",")+" % Brna"}</div>`;
if(!lvl){const p=sel.a.map(x=>x/sel.v*100);h+=`<div class="st"><div style="width:${p[0]}%;background:#6fb58a"></div><div style="width:${p[1]}%;background:var(--c3)"></div><div style="width:${p[2]}%;background:var(--ac)"></div></div><div class="l2"><span>0–14: ${p[0].toFixed(0)} %</span><span>15–64: ${p[1].toFixed(0)} %</span><span>65+: ${p[2].toFixed(0)} %</span></div>`+(sel.k.length?`<div class="s" style="margin:8px 0 0">Katastry: ${sel.k.map(k=>k[0]+" "+f(k[1])).join(" · ")}</div>`:"")}
$("d").innerHTML=h}
$("m0").onclick=()=>{lvl=0;draw()};$("m1").onclick=()=>{lvl=1;draw()};$("v0").onclick=()=>{met=0;draw()};$("v1").onclick=()=>{met=1;draw()};draw();
</script></body></html>
